var ESSAYS=[
["简述我国非物质文化遗产的保护工作方针。","我国非物质文化遗产保护工作方针是：保护为主、抢救第一、合理利用、传承发展。（口诀：保抢合传）\n1.保护为主：把保护放在首要位置，守住文化本体。\n2.抢救第一：对濒临消失的项目优先开展抢救性记录。\n3.合理利用：在保护基础上适度开发利用，服务社会。\n4.传承发展：鼓励传承人开展传习活动，实现活态传承。"],
["简述我国民族分布特点及民族政策的主要内容。","民族分布特点：大杂居、小聚居、交错杂居（口诀：大杂小聚交错居）。\n民族政策主要内容：\n1.民族平等：各民族不论人口多少，一律平等。\n2.民族团结：维护各民族之间团结，反对民族分裂。\n3.民族区域自治：在少数民族聚居地区实行民族区域自治制度。\n4.各民族共同繁荣：推动少数民族地区经济文化共同发展。"],
["简述中国古代木构架建筑中斗拱的作用。","斗拱是我国古代木构架建筑特有的构件，位于立柱与梁枋之间。\n1.承重挑檐：把屋檐重量传递给立柱，并挑出屋檐。\n2.装饰作用：造型精巧，具有建筑装饰效果。\n3.等级标志：斗拱的大小、层数代表建筑等级，等级越高越复杂。\n4.抗震作用：采用榫卯连接，具有一定的缓冲减震效果。"],
["简述我国六大茶类及其发酵特点。","我国六大茶类：绿茶、白茶、黄茶、青茶（乌龙茶）、红茶、黑茶。\n1.绿茶：不发酵，代表龙井、碧螺春。\n2.白茶：轻微发酵，代表白毫银针。\n3.黄茶：轻发酵，代表君山银针。\n4.青茶（乌龙茶）：半发酵，代表铁观音、大红袍。\n5.红茶：全发酵，代表祁门红茶。\n6.黑茶：后发酵，代表普洱茶。"],
["简述陶器与瓷器的主要区别。","1.原料不同：陶器多用普通黏土，瓷器使用高岭土。\n2.烧成温度不同：陶器温度较低，瓷器一般需1200℃以上高温。\n3.胎体质地：陶器胎质粗松、有气孔；瓷器胎体致密坚硬。\n4.透光性：陶器不透光，瓷器具有半透光性。\n5.釉面：陶器可以无釉，瓷器大多施釉、釉面光洁。"],
["简述汉字“六书”的含义。","六书是古人总结的汉字构造与使用的六种方式，含四种造字法和两种用字法。\n1.象形：描摹事物外形造字，如日、月。\n2.指事：用符号标记抽象含义，如上、下、本。\n3.会意：组合两个或多个字合成新义，如休、采。\n4.形声：由形旁（表意）和声旁（表音）组合而成，现代汉字绝大多数是形声字。\n5.转注：属用字法，字义相近互相注释。\n6.假借：属用字法，借用已有同音字记录新词。\n（口诀：六书象指会形，转假是用字；隶书是古今文字分水岭。）"],
["简述导游语言的基本特点。","导游语言具有实、宽、活、美四个主要特点。\n1.实：内容真实客观，介绍景观与历史信息准确，不编造虚假信息。\n2.宽：语言口语化、通俗易懂，兼顾不同文化水平游客的理解。\n3.活：讲解灵活，根据现场环境和游客反应及时调整内容。\n4.美：语言讲究修辞，生动优美、富有感染力，提升游览体验。"],
["结合导游工作，谈谈学习旅游文学对导游的意义。","1.丰富讲解素材：诗词、游记可融入导游词，提升讲解文采。\n2.加深文化理解：读懂古人对山水的描写，看懂景点背后的文化底蕴。\n3.提升语言表达：借鉴文学修辞手法，让导游语言更生动优美。\n4.提升文化素养：更好地向游客传递中华优秀传统文化。"],
["简述一篇合格导游词的基本写作要求。","1.内容准确：历史、文物、民俗信息要严谨真实，不能虚构。\n2.重点突出：抓住景点核心特色，避免面面俱到的流水账。\n3.语言生动：适当运用比喻、引用诗词，增强感染力，适合口头讲解。\n4.有针对性：根据游客年龄、文化背景调整内容深浅。\n5.结构完整：包含开场白、主体讲解、结束语，逻辑通顺。"],
["简述社会主义核心价值观三个层面的内容。","1.国家层面：富强、民主、文明、和谐。\n2.社会层面：自由、平等、公正、法治。\n3.公民个人层面：爱国、敬业、诚信、友善。"],
["简述我国古代建筑屋顶的等级顺序并各举一例。","等级由高到低：重檐庑殿顶＞重檐歇山顶＞单檐庑殿顶＞单檐歇山顶＞悬山顶＞硬山顶＞攒尖顶。\n（口诀：重庑重歇单庑歇，悬硬攒尖往后列）\n举例：故宫太和殿为重檐庑殿顶（最高等级）；故宫保和殿为重檐歇山顶；亭、阁、塔多用攒尖顶。"],
["简述我国四大宗教及其主要经典或代表人物。","1.佛教：起源古印度，西汉末年传入中国，经典为《大藏经》等，分汉传、藏传、南传三大系统。\n2.道教：中国本土宗教，东汉创立，尊老子为道祖，经典为《道德经》。\n3.伊斯兰教：创始人穆罕默德，经典为《古兰经》，主要节日有开斋节、古尔邦节。\n4.基督教：创始人耶稣，经典为《圣经》，分天主教、东正教、新教三大派。"] ,
["简述世界遗产的分类以及我国入选《世界遗产名录》的情况。","世界遗产一般分为文化遗产、自然遗产、文化与自然双重遗产三类（另有文化景观等类别）。\n我国1985年加入《保护世界文化和自然遗产公约》，1987年首批列入的有长城、故宫、莫高窟、秦始皇陵及兵马俑坑、周口店北京人遗址和泰山。\n典型例子：泰山、黄山、峨眉山—乐山大佛为文化与自然双重遗产；九寨沟、黄龙、三江并流、武陵源为自然遗产；平遥古城、丽江古城、中国大运河等为文化遗产；庐山为我国第一个世界文化景观遗产。"],
["简述京剧的角色行当及脸谱色彩的常见含义。","京剧四大行当为生、旦、净、丑：生为男性角色，旦为女性角色，净为花脸，丑为滑稽角色。\n脸谱色彩常见含义：红色多表示忠勇正直；黑色多表示刚直勇猛；白色多表示奸诈阴险；金银色多用于神怪。"],
["简述汉字形体演变的几个主要阶段。","汉字形体演变大体经历：甲骨文—金文—小篆—隶书—楷书，并伴生草书、行书。\n1.甲骨文：商代刻在龟甲兽骨上的文字，是我国已知最早的成熟文字。\n2.金文：铸刻在青铜器上的文字，又称钟鼎文。\n3.小篆：秦代统一文字后的标准书体。\n4.隶书：汉代通行，由篆到隶的转变称“隶变”，是古今文字的分水岭。\n5.楷书：魏晋以后通行至今的正体字。"],
["简述导游讲解中运用汉字修辞手法的作用。","1.增强趣味性：谐音、拆字、双关等手法可使讲解生动有趣，吸引游客注意。\n2.加深理解记忆：通过字形、字义的分析，帮助游客理解景点名称与文化内涵。\n3.提升文化品位：恰当运用修辞可体现讲解的文化底蕴与语言艺术。\n4.需注意适度得体：修辞服务于内容，不可牵强附会、哗众取宠。"]];

var P=19,NSETS=200,NQ=20;
function hsh(a,b){var h=Math.imul(a+1,73856093)^Math.imul(b+1,19349663);h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}
function rngf(seed){var s=(seed>>>0)||1;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function shuf(arr,seed){var r=rngf(seed),a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function setMap(s){var x=Math.floor(s/P),y=s%P,o=[];for(var m=0;m<P;m++){o.push([m,((y-m*x)%P+P)%P])}o.push([P,x]);return o}
function buildQ(col,val){
  var c=COLUMNS[col],it=c.it[val];
  var q={uid:col+"-"+val,col:col,sub:c.sub,subj:(c.sub=="1"?"科目一":"科目二"),topic:c.n,type:c.type,q:it[1],explain:it[it.length-1]};
  if(c.type=="s"){var cor=it[2];var o=shuf(it[3].concat([cor]),hsh(col,val));q.opts=o;q.ans=[o.indexOf(cor)]}
  else if(c.type=="m"){var cors=it[2];var o2=shuf(cors.concat(it[3]),hsh(col,val));q.opts=o2;q.ans=cors.map(function(x){return o2.indexOf(x)}).sort(function(p,r){return p-r})}
  else if(c.type=="j"){q.opts=["正确","错误"];q.ans=[it[2]?0:1]}
  else if(c.type=="f"){q.answers=it[2]}
  return q;
}
function buildSet(s){return setMap(s).map(function(p){return buildQ(p[0],p[1])})}

  if(q.type=="f")return !!p.ok;
  var a=(p.sel||[]).slice().sort(function(x,y){return x-y});
  if(a.length!=q.ans.length)return false;
  for(var i=0;i<a.length;i++)if(a[i]!=q.ans[i])return false;
  return true;
}
function markWrong(uid,isW){
  var w=jload(LS_WRONG,[]),p=w.indexOf(uid);
  if(isW){if(p<0)w.push(uid)}else{if(p>=0)w.splice(p,1)}
  jsave(LS_WRONG,w);
}
function bumpStat(right){
  var s=jload(LS_STAT,{n:0,r:0,sets:0});s.n++;if(right)s.r++;jsave(LS_STAT,s);
}
function renderEssay(){
  var app=document.getElementById("app"),h='<div class="wt">背诵专区 · 简述/论述题（不参与套题轮换）</div><div class="foot" style="padding:0 0 12px">共 '+ESSAYS.length+' 题，直接背诵上考场</div>';
  for(var i=0;i<ESSAYS.length;i++){h+='<div class="essay"><div class="eq">'+(i+1)+'. '+ESSAYS[i][0]+'</div><div class="ea">'+ESSAYS[i][1]+'</div></div>'}
  app.innerHTML=h;document.getElementById("counter").textContent="背诵";
  document.getElementById("prev").disabled=true;document.getElementById("next").disabled=true;
  document.getElementById("prog").style.width="100%";
}
function render(){
  var app=document.getElementById("app");
  document.getElementById("setno").textContent="第 "+(st.set+1)+" 套 / 共 "+NSETS+" 套";
  if(st.mode=="essay"){renderEssay();return}
  if(st.done){renderSummary();return}
  var q=st.qs[st.idx],p=st.picked[st.idx],an=answered(st.idx),h="";
  h+='<div class="meta"><div class="tags"><span class="badge'+(q.sub=="2"?" hy":"")+'">'+q.subj+'</span><span class="badge ty">'+({s:"单选",m:"多选",j:"判断",f:"填空"})[q.type]+'</span><span class="badge" style="background:#f1f5f9;color:#475569">'+q.topic+'</span></div><span>第 '+(st.idx+1)+' / '+st.qs.length+' 题</span></div>';
  h+='<div class="q">'+q.q+'</div>';
  if(q.type=="f"){
    h+='<div class="fill"><input id="finput" type="text" placeholder="请输入答案" autocomplete="off" '+(an?"disabled":"")+' value="'+(p&&p.text?p.text.replace(/"/g,"&quot;"):"")+'"></div>';
    if(!an)h+='<button class="act" id="fsubmit">提交答案</button>';
  }else{
    h+='<div class="opts">';
    for(var i=0;i<q.opts.length;i++){
      var cls="opt",chosen=p&&p.sel?p.sel.indexOf(i)>=0:false;
      if(an){if(q.ans.indexOf(i)>=0)cls+=" ok";else if(chosen)cls+=" no";cls+=" locked"}
      else if(chosen)cls+=" sel";
      h+='<button class="'+cls+'" data-i="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span><span class="t">'+q.opts[i]+'</span></button>';
    }
    h+='</div>';
    if(!an&&q.type=="m")h+='<button class="act" id="msubmit">确认答案（多选）</button>';
    if(!an)h+='<button class="act ghost" id="reveal">不会，直接看答案</button>';
  }
  if(an){
    var r=isRight(q,p);
    h+='<div class="fb '+(r?"fb-ok":"fb-no")+'">'+(r?"✅ 回答正确":(p.reveal?"已显示答案":"❌ 回答错误"))+' · 正确答案：'+(q.type=="f"?q.answers.join(" / "):q.ans.map(function(x){return String.fromCharCode(65+x)}).join(""))+'</div>';
    h+='<div class="exp"><b>解析：</b>'+q.explain+'</div>';
  }
  app.innerHTML=h;
  var os=app.querySelectorAll(".opt");
  for(var k=0;k<os.length;k++)os[k].onclick=function(){tapOpt(parseInt(this.getAttribute("data-i"),10))};
  var rv=document.getElementById("reveal");if(rv)rv.onclick=function(){doReveal()};
  var ms=document.getElementById("msubmit");if(ms)ms.onclick=function(){submitMulti()};
  var fs=document.getElementById("fsubmit");if(fs)fs.onclick=function(){submitFill()};
  var fi=document.getElementById("finput");if(fi&&fi.addEventListener)fi.addEventListener("keydown",function(e){if(e.keyCode==13)submitFill()});
  updateNav();updateProg();
}
function tapOpt(i){
  var q=st.qs[st.idx];if(answered(st.idx))return;
  if(q.type=="m"){var s=st.sel.indexOf(i);if(s<0)st.sel.push(i);else st.sel.splice(s,1);render();return}
  finish([i]);
}
function submitMulti(){if(!st.sel.length)return;finish(st.sel.slice())}
function submitFill(){
  var el=document.getElementById("finput");if(!el)return;
  var t=el.value,q=st.qs[st.idx];
  var ok=false;for(var i=0;i<q.answers.length;i++)if(norm(t)===norm(q.answers[i])){ok=true;break}
  finish([],{text:t,ok:ok});
}
function doReveal(){var q=st.qs[st.idx];finish(q.type=="f"?[]:q.ans.slice(),{reveal:true,ok:false,text:""})}
function finish(sel,extra){
  if(answered(st.idx))return;
  var p={sel:sel.slice()};if(extra)p=extra;else p.reveal=false;
  if(!extra)p.reveal=false;
  st.picked[st.idx]=p;st.sel=[];
  var q=st.qs[st.idx],r=isRight(q,p);
  markWrong(q.uid,!r);bumpStat(r);render();
}
function next(){if(!answered(st.idx))return;if(st.idx<st.qs.length-1){st.idx++;st.sel=[];render()}else{st.done=true;render()}}
function prev(){if(st.idx>0){st.idx--;st.sel=[];render()}}
function renderSummary(){
  var app=document.getElementById("app"),n=st.qs.length,right=0,wrongIdx=[],i;
  for(i=0;i<n;i++)if(isRight(st.qs[i],st.picked[i]))right++;else wrongIdx.push(i);
  var h='<div class="sum"><div class="score">'+right+' / '+n+'</div>';
  h+='<div class="rate">正确率 '+Math.round(right/n*100)+'%　·　错题 '+wrongIdx.length+' 题</div>';
  h+='<div class="acts"><button class="btn primary" id="again">重做本套</button><button class="btn" id="newset">换一套</button>'+(wrongIdx.length?'<button class="btn" id="wonly">只看错题</button>':'')+'</div></div>';
  if(wrongIdx.length){
    h+='<h3 class="wt">本套错题回顾</h3>';
    for(var j=0;j<wrongIdx.length;j++){
      var q=st.qs[wrongIdx[j]];
      h+='<div class="wcard"><div class="wq">'+(j+1)+'. ['+({s:"单选",m:"多选",j:"判断",f:"填空"})[q.type]+'] '+q.q+'</div><div class="wa">正确答案：'+(q.type=="f"?q.answers.join(" / "):q.ans.map(function(x){return String.fromCharCode(65+x)+". "+q.opts[x]}).join("；"))+'</div><div class="we">解析：'+q.explain+'</div></div>';
    }
  }
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){st.idx=0;st.done=false;st.sel=[];for(var i2=0;i2<st.qs.length;i2++)st.picked[i2]=null;render()};
  document.getElementById("newset").onclick=function(){startSet(pickSet());render()};
  var wo=document.getElementById("wonly");
  if(wo)wo.onclick=function(){
    var ks=[];for(var i3=0;i3<st.qs.length;i3++)if(!isRight(st.qs[i3],st.picked[i3]))ks.push(st.qs[i3]);
    st.qs=ks;st.idx=0;st.done=false;st.sel=[];st.picked=[];
    for(var i4=0;i4<ks.length;i4++)st.picked.push(null);
    render();
  };
  document.getElementById("prev").disabled=true;
  document.getElementById("next").disabled=true;
  document.getElementById("prog").style.width="100%";
}
function updateNav(){
  var n=st.qs.length,prev=document.getElementById("prev"),nx=document.getElementById("next");
  document.getElementById("counter").textContent=(st.done?n:st.idx+1)+" / "+n;
  prev.disabled=(st.done||st.idx===0);
  nx.disabled=(st.done||!answered(st.idx));
  nx.textContent=(st.idx>=n-1)?"查看结果":"下一题 ›";
}
function updateProg(){
  var n=st.qs.length,c=0,i;for(i=0;i<n;i++)if(answered(i))c++;
  document.getElementById("prog").style.width=(st.done?100:c/n*100)+"%";
  var s=jload(LS_STAT,{n:0,r:0}),w=jload(LS_WRONG,[]).length;
  document.getElementById("stat").textContent="累计作答 "+s.n+" 题　正确率 "+(s.n?Math.round(s.r/s.n*100):0)+"%　错题本 "+w+" 题";
}
document.getElementById("prev").onclick=prev;
document.getElementById("next").onclick=next;
document.getElementById("shuffleSet").onclick=function(){startSet(pickSet());render();updateProg()};
document.getElementById("redoSet").onclick=function(){startSet(st.set);render();updateProg()};
document.getElementById("jump").onclick=function(){
  var v=window.prompt("输入套号（1 - "+NSETS+"）",""+(st.set+1));
  if(v===null)return;var n=parseInt(v,10);
  if(isNaN(n)||n<1||n>NSETS){window.alert("请输入 1 到 "+NSETS+" 之间的数字");return}
  startSet(n-1);render();updateProg();
};
document.getElementById("tEssay").onclick=function(){
  if(st.mode=="essay"){st.mode="quiz";this.classList.remove("on");render()}
  else{st.mode="essay";this.classList.add("on");renderEssay()}
};
st.set=pickSet();st.qs=buildSet(st.set);
for(var zi=0;zi<st.qs.length;zi++)st.picked.push(null);
render();updateProg();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}
</script>
